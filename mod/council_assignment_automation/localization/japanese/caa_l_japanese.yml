l_japanese:
 caa_title:0 "評議員の自動任命"
 caa_open_settings:0 "評議会の自動化"
 caa_open_settings_tt:0 "評議員の自動任命と交代を設定します。"
 caa_intro:0 "自動化を有効にしたときや設定を変更したときに確認し、その後は30日ごとに確認します。初期状態ではすべて無効です。設定はこの統治者ごとに保存されます。"
 caa_enabled_label:0 "自動任命を有効にする"
 caa_enabled_tt:0 "空席の役職に就任資格を持つ人物を任命します。無効にすると、他の設定を保持したまま、自動任命、交代、役職の入れ替えをすべて停止します。"
 caa_powerful_label:0 "有力な封臣を優先する"
 caa_powerful_tt:0 "就任資格のある有力な封臣を優先し、各役職に必要な能力に応じて配置します。無効の場合は能力のみで選びます。自動化が有効な間は、能力が変化すると在任中の有力な封臣の役職を入れ替えます。交代の監視が無効でも、この入れ替えは行われます。"
 caa_observer_label:0 "交代候補の監視を有効にする"
 caa_observer_tt:0 "自動化が有効な間、より優秀な候補者と有力な封臣の地位の変化を確認します。選択した優先方針に従って評議会の構成を改善できる場合、在任中の評議員を交代させます。無効の場合は空席を補充し、上記の有力な封臣同士の役職の入れ替えだけを続けます。"
 caa_limits_help:0 "通常の評議会で認められた任命のみを自動化します。配偶者の役職、解任から保護された評議員、特殊な評議会は対象外です。宮廷聖職者は統治者に任命権がある場合のみ対象となります。このメニューを閉じても自動化は停止しません。"
 caa_close:0 "閉じる"
