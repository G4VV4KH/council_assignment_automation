l_simp_chinese:
 caa_title:0 "内阁自动任命"
 caa_open_settings:0 "内阁自动化"
 caa_open_settings_tt:0 "设置内阁成员的自动任命与替换。"
 caa_intro:0 "开启自动化或更改设置时立即检查，此后每30天检查一次。所有选项初始均为关闭，设置按当前统治者保存。"
 caa_enabled_label:0 "开启自动任命"
 caa_enabled_tt:0 "为内阁空缺职位任命符合资格的角色。关闭后停止所有自动任命、替换与职位调换，同时保留其他设置。"
 caa_powerful_label:0 "优先任命强力封臣"
 caa_powerful_tt:0 "优先任命符合资格的强力封臣，再根据各职位所需能力分配职位。关闭时只按能力选择候选人。自动化开启期间，已在内阁任职的强力封臣可在能力变化后调换职位，即使替换监测已关闭也会如此。"
 caa_observer_label:0 "开启替换监测"
 caa_observer_tt:0 "自动化开启期间，检查更优秀的候选人及强力封臣身份的变化。若按照所选优先规则可以改善内阁配置，则替换现任成员。关闭时只填补空缺，并保留上述强力封臣之间的职位调换。"
 caa_limits_help:0 "仅管理普通内阁中允许进行的任命。配偶职位、受免职保护的成员及特殊内阁不在范围内。只有统治者有权任命宫廷司祭时才会管理该职位。关闭此菜单不会停止自动化。"
 caa_close:0 "关闭"
