l_korean:
 caa_title:0 "자문위원 자동 임명"
 caa_open_settings:0 "자문회 자동화"
 caa_open_settings_tt:0 "자문위원 자동 임명과 교체를 설정합니다."
 caa_intro:0 "자동화를 켜거나 설정을 변경하면 즉시 확인하고, 이후 30일마다 확인합니다. 모든 옵션은 처음에는 꺼져 있으며, 설정은 이 통치자를 기준으로 저장됩니다."
 caa_enabled_label:0 "자동 임명 켜기"
 caa_enabled_tt:0 "빈 자문회 직위에 자격을 갖춘 인물을 임명합니다. 끄면 다른 설정을 유지한 채 모든 자동 임명, 교체, 직위 맞교환을 중단합니다."
 caa_powerful_label:0 "권세 봉신 우선 임명"
 caa_powerful_tt:0 "자격을 갖춘 권세 봉신을 우선하고, 각 직위에 필요한 능력에 따라 배치합니다. 끄면 능력만으로 후보자를 선택합니다. 자동화가 켜져 있으면 능력이 바뀔 때 재임 중인 권세 봉신끼리 직위를 맞바꿀 수 있습니다. 교체 감시가 꺼져 있어도 이 기능은 작동합니다."
 caa_observer_label:0 "교체 후보 감시 켜기"
 caa_observer_tt:0 "자동화가 켜져 있는 동안 더 뛰어난 후보자와 권세 봉신 지위의 변화를 확인합니다. 선택한 우선순위에 따라 더 나은 자문회를 구성할 수 있으면 현재 자문위원을 교체합니다. 끄면 빈 직위를 채우고 위에 설명한 권세 봉신 간 직위 맞교환만 유지합니다."
 caa_limits_help:0 "일반 자문회에서 허용된 임명만 관리합니다. 배우자 직위, 해임으로부터 보호되는 자문위원, 특수 자문회는 제외됩니다. 궁정 사제는 통치자에게 임명권이 있을 때만 대상이 됩니다. 이 메뉴를 닫아도 자동화는 중단되지 않습니다."
 caa_close:0 "닫기"
