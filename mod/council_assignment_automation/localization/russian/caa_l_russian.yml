l_russian:
 caa_title:0 "Автоназначение советников"
 caa_open_settings:0 "Автоназначение в совет"
 caa_open_settings_tt:0 "Настроить автоматическое назначение и замену советников."
 caa_intro:0 "Проверка выполняется при включении автоматизации или изменении её настроек, затем каждые 30 дней. Изначально все настройки выключены; они сохраняются для этого правителя."
 caa_enabled_label:0 "Включить автоназначение"
 caa_enabled_tt:0 "Заполнять свободные должности в совете подходящими персонажами. Выключение останавливает все автоматические назначения, замены и перестановки, сохраняя остальные настройки."
 caa_powerful_label:0 "Приоритет могущественным вассалам"
 caa_powerful_tt:0 "Сначала назначать подходящих могущественных вассалов, распределяя должности по навыкам. Без этой настройки кандидаты выбираются только по навыкам. При включённой автоматизации могущественные вассалы в совете могут меняться должностями при изменении навыков, даже если обозреватель замен выключен."
 caa_observer_label:0 "Включить обозреватель замен"
 caa_observer_tt:0 "При включённой автоматизации отслеживать более способных кандидатов и изменения статуса могущественных вассалов. Заменять действующих советников, если выбранный приоритет позволяет улучшить состав совета. При выключении заполняются вакансии и сохраняются описанные выше перестановки могущественных вассалов."
 caa_limits_help:0 "Автоматизация охватывает только допустимые назначения в обычный совет. Должности супругов, защищённые от увольнения советники и особые советы исключены. Придворный капеллан назначается только там, где правитель вправе его выбирать. Закрытие меню не останавливает автоматизацию."
 caa_close:0 "Закрыть"
